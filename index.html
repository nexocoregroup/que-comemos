  <meta name="description" content="Decide en familia qué se desayuna, se almuerza y se cena, y lleva la lista al colmado.">
  <!-- Lo que el navegador tiene permitido hacer con esta página.
       No es una muralla, y conviene decir por qué: `script-src` lleva
       `'unsafe-inline'` porque Capacitor inyecta su puente como un <script> en
       línea justo después de <head>, y sin eso la app quedaría muerta dentro del
       APK. Así que esta regla NO detiene un script inyectado. Lo que sí hace, y
       no es poco:

         · Ningún script de otro sitio. Un ataque no puede traerse herramientas.
         · Sin `'unsafe-eval'`: `eval` y `new Function` no funcionan ni aunque
           alguien logre meter código.
         · `connect-src` nombra UN solo destino. Esto se estrechó al añadir las
           cuentas y es la regla que más trabaja ahora: antes decía `https:` a
           secas, que permitía mandar la despensa de una casa a cualquier
           servidor del mundo mientras fuera cifrado. Hoy solo admite el
           proyecto de Supabase, así que aunque alguien lograra colar código,
           no tendría a dónde mandarse lo que leyera.

           Si algún día el proyecto vive en un dominio propio en vez de en
           `*.supabase.co`, hay que añadirlo aquí o las llamadas fallarán con un
           error de la política que no menciona esta línea. Hay una prueba en
           tests/seguridad.test.js que lo recuerda.
         · `object-src 'none'` y `base-uri 'none'` cierran dos vías clásicas.

       La defensa de verdad contra esto es que todo texto del usuario se escapa
       antes de llegar a la pantalla, y eso lo vigila tests/seguridad.test.js.
       Esto es el cinturón, no los frenos.

       `frame-ancestors` no se puede poner en un <meta>: solo vale como cabecera
       HTTP, y server.js la manda. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
