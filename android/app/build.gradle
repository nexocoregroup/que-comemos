apply plugin: 'com.android.application'

// La clave de publicación vive fuera del repositorio.
//
// Firmar para Play Store necesita un almacén de claves y su contraseña. Ni el
// archivo ni la contraseña pueden estar aquí: quien los tenga puede publicar
// actualizaciones de tu app a tu nombre, y Google **no** permite cambiar esa
// clave una vez publicada la primera versión. Si se pierde, se pierde la app.
//
// Por eso se leen de `android/keystore.properties`, que está en .gitignore.
// Hay una plantilla al lado: `keystore.properties.example`.
//
// Si el archivo no existe, la compilación sigue funcionando y solo deja el
// paquete sin firmar. Así nadie que clone el proyecto se queda sin poder
// compilar por no tener una clave que no debería tener.
def archivoFirma = rootProject.file('keystore.properties')
def hayFirma = archivoFirma.exists()
def datosFirma = new Properties()
if (hayFirma) {
    archivoFirma.withInputStream { datosFirma.load(it) }
}

android {
    namespace = "com.nexocore.quecomemos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nexocore.quecomemos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Dos números que no son lo mismo y se confunden siempre.
        //
        // `versionCode` es para Play: un entero que tiene que ser MAYOR que el
        // de la última versión publicada, y nunca repetirse. No se enseña a
        // nadie. `versionName` es lo que la gente lee en la ficha de la tienda,
        // y puede ser lo que quieras.
        //
        // La trampa está en cuándo avisa el error: Play rechaza un versionCode
        // repetido **al subir el paquete**, no al compilar. Así que se compila
        // bien, se firma bien, se espera la subida entera y ahí es donde se
        // descubre. Súbelo antes de generar el AAB, no después.
        //
        //   1.ª publicación → versionCode 1,  versionName "1.0"
        //   la siguiente    → versionCode 2,  versionName "1.0.1" o "1.1"
        //
        // Si usas la firma de aplicaciones de Play, el número tampoco se puede
        // reutilizar aunque hayas retirado la versión que lo llevaba.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Va antes de `buildTypes` a propósito: Gradle evalúa este bloque de arriba
    // abajo, y `release` se refiere a esta configuración por su nombre.
    signingConfigs {
        if (hayFirma) {
            publicacion {
                // `rootProject.file` y no `file`: dentro del módulo `app`, `file`
                // resuelve desde `android/app/`, y la ruta del almacén se escribe
                // —y se documenta en la plantilla— relativa a `android/`, que es
                // donde está el archivo de propiedades que la trae. Con `file` a
                // secas, Gradle buscaba el sello en `android/app/` y fallaba con
                // un «keystore file not found» que suena a que no lo creaste.
                //
                // Solo se descubre al firmar de verdad: la compilación de
                // depuración no pasa por aquí.
                storeFile rootProject.file(datosFirma['storeFile'])
                storePassword datosFirma['storePassword']
                keyAlias datosFirma['keyAlias']
                keyPassword datosFirma['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Solo la arquitectura de los teléfonos de verdad.
            //
            // Los motores nativos —el lector de texto pesa unos 10 MB él solo—
            // se empaquetan una vez por arquitectura, y sin filtrar iban cuatro:
            // 39 de los 52 MB del APK eran eso. `x86` y `x86_64` solo sirven
            // para emuladores, y `armeabi-v7a` para teléfonos de hace más de una
            // década. Quitando las tres, el APK de depuración bajó a unos 23 MB
            // y compila más rápido. Después, al quitarse la lectura de facturas
            // con sus modelos de OCR, se quedó en 4,4 MB medidos el 16 de
            // septiembre de 2026.
            //
            // Esto vale solo para depuración, que es el archivo que se pasa a
            // mano al teléfono. La versión de Play Store se sube como AAB y allí
            // Google hace este mismo reparto solo, generando un paquete por
            // dispositivo: no hay que tocar nada para eso.
            //
            // Si algún día hace falta probar en un emulador x86, se comenta este
            // bloque y se vuelve a compilar.
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            if (hayFirma) {
                signingConfig signingConfigs.publicacion
            }
            // Quita el código y los recursos que nadie usa. Sin esto el paquete
            // carga las cinco variantes de idioma del lector de texto y medio
            // androidx que no se toca nunca.
            minifyEnabled true
            shrinkResources true
            // `proguard-android.txt` y no `-optimize`: la versión optimizada
            // reordena y alinea código, y esta app está llena de cosas que se
            // resuelven por reflexión —los complementos de Capacitor, los
            // modelos de ML Kit—. Un fallo de esos solo aparece en release,
            // que es donde menos se prueba. El ahorro extra no compensa.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
